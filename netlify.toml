[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# API 路由 — 先匹配！/api/* → Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA 回退 — 最后兜底（除了 /api/* 之外的都走这里）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
